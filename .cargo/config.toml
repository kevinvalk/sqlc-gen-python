# We keep native as the default target so `cargo test` needs no flag, and build the WASM plugin with `cargo wasm`. It
# is `--locked` so a plugin, released ones included, is built from the committed Cargo.lock or not at all.
[alias]
wasm = "build --locked --release --target wasm32-wasip1 --package sqlc-gen-python"
xtask = "run --quiet --package xtask --"
