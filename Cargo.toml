[package]
name = "sqlc-gen-python"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "AGPL-3.0-or-later OR LicenseRef-KevinValk-Commercial"
description = "A sqlc codegen plugin that generates Python"
repository = "https://github.com/codean-io/rust-sqlc-gen-python"

[lib]
name = "sqlc_gen_python"
path = "src/lib.rs"

[[bin]]
name = "sqlc-gen-python"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Ruff supplies both halves of the emit pipeline: a typed Python AST to build
# against, and the Black-compatible formatter that decides the final layout.
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.4" }
ruff_python_codegen = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.4" }
ruff_python_formatter = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.4" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.4", version = "0.0.10" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.4" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.4" }
thin-vec = "0.2.19"
heck = "0.5.0"
pluralizer = "0.5.0"

[build-dependencies]
prost-build = "0.14"
# Ships a `protoc` binary so building needs nothing installed system-wide.
protoc-bin-vendored = "3.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.4" }
similar-asserts = "2.0.0"
