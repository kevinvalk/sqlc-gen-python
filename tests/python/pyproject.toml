# The Python side of the test suite, which `cargo test` never needs. Its tool configuration is our definition of
# "best-practice Python" for the generated code: every file the plugin emits must pass ruff with all rules, pyright
# strict and mypy strict, targeting the minimum supported Python.

[project]
name = "sqlc-gen-python-tests"
version = "0.0.0"
requires-python = ">=3.11"

[dependency-groups]
# We pin exactly, so a tool upgrade that changes a verdict shows up as a diff here.
dev = [
    # The async driver of the sqlite3 backend.
    "aiosqlite==0.22.1",
    # The async driver of the pymysql backend, and SQLAlchemy's (`mysql+asyncmy`). Not aiomysql 0.3.2, as that cannot
    # bind `bytes` on PyMySQL 1.2.
    "asyncmy==0.2.18",
    "asyncpg==0.32.0",
    # Draws the arguments of the runtime sweep (autoprop.py).
    "hypothesis==6.168.5",
    "mypy==2.4.1",
    # PostgreSQL's own scanner, libpg_query, which sqlc parses with (through pg_query_go) and scanner.py holds the SQL
    # rewriting to.
    "pglast==7.22",
    "psycopg[binary]==3.3.8",
    # `records: pydantic`
    "pydantic==2.14.3",
    # The `nodejs` extra bundles node, so pyright never downloads it at runtime
    "pyright[nodejs]==1.1.414",
    "pymysql==1.2.4",
    "pytest==9.2.0",
    # Reads sqlc configurations, which may be YAML, when capturing sqlc.s endtoend tests
    "pyyaml==6.0.3",
    # IMPORTANT: Must match the ruff crates in Cargo.toml, which the plugin formats with (tests/rust/golden.rs holds
    # the two together).
    "ruff==0.17.4",
    # Generated code must work with SQLAlchemy 2.0 and 2.1, so we test the older one on the minimum Python.
    "sqlalchemy[asyncio]==2.0.57; python_version < '3.12'",
    "sqlalchemy[asyncio]==2.1.8; python_version >= '3.12'",
    "types-pymysql==1.2.4.20261111",
    "types-pyyaml==6.0.12.20261111",
]

[tool.uv]
# A range, so a developer's uv need not be the exact release CI runs (`UV_VERSION` in .github/workflows/ci.yml), as
# uv.lock decides every package either way.
required-version = ">=0.13.7,<0.14"

# The lint contract for generated code: every rule, minus those generated code cannot or should not satisfy. `gate.py`
# applies exactly this to everything the plugin emits, and the developer scripts extend it in `ruff.toml`. We set no
# pydocstyle `convention`, as that would turn off more rules than these, unlisted.
[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter (ruff's own advice)
    "INP001", # the package's `__init__.py` is the application's, if it wants one
    "CPY", # generated files carry no copyright header
    "D1", # docstrings come only from SQL comments, as invented ones would restate names
    # Docstrings are the user's SQL comments, verbatim: these judge what one says (punctuation, mood, capitals, its first
    # word, sections), not how we lay it out
    "D205", "D214", "D215", "D400", "D401", "D402", "D403", "D404", "D405", "D406",
    "D407", "D408", "D409", "D410", "D411", "D412", "D413", "D414", "D415", "D416",
    "D417",
    "D203", "D213", # each conflicts with the layout we follow instead (D211, D212)
    "D301", # a backslash in a comment is the author's, written `\\`, as a raw string cannot hold every comment
    "RUF001", "RUF002", # SQL and its comments are the user's text: an en dash is what they wrote, not a confusable
    "E501", # SQL is written verbatim, so its lines can be long
    "E741", # `l`, `I` and `O` are the schema's names, not ours to change
    "A002", # a parameter `id`, which we keep so no call site reads `id_`
    "ANN401", # `Any` is the user's own choice, in an override or as `unknown_type`
    "PLR0913", # the parameter count comes from the SQL, and every parameter is keyword-only
    "PT028", # a query named `Test...` is a function pytest would take for a test, and its nullable parameters default
]

[tool.pyright]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.mypy]
strict = true
# Without paths we check the developer scripts and the suite (`cargo xtask check`). The gate names the generated
# packages it checks itself, and `suite/usage.py` too, as that is written against them.
files = ["$MYPY_CONFIG_FILE_DIR/*.py", "$MYPY_CONFIG_FILE_DIR/suite"]
exclude = ['suite/usage\.py$']
# `suite` is a pytest directory, not a package.
mypy_path = "$MYPY_CONFIG_FILE_DIR"
explicit_package_bases = true

[tool.pytest.ini_options]
# The runtime suite's tests import the shared modules here (`postgres`, `mysql`, `examples`).
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]
# A proof that runs nothing proves nothing, so an empty parametrization fails and so does a skipped test (conftest.py).
empty_parameter_set_mark = "fail_at_collect"
