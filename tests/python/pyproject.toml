# The Python side of the test suite. `cargo test` never needs it.
#
# Its tool configuration is the definition of "best-practice Python" for the
# generated code: every file the plugin emits must pass ruff with all rules,
# pyright strict and mypy strict, targeting the minimum supported Python.

[project]
name = "sqlc-gen-python-tests"
version = "0.0.0"
requires-python = ">=3.10"

[dependency-groups]
# Exact pins: a tool upgrade that changes a verdict must show up as a diff here.
dev = [
    # The async driver of the sqlite3 backend.
    "aiosqlite==0.22.1",
    # SQLAlchemy's async MySQL driver (`mysql+asyncmy`). Not aiomysql 0.3.2,
    # which cannot bind `bytes` on PyMySQL 1.2.
    "asyncmy==0.2.18",
    "asyncpg==0.32.0",
    # Draws the arguments of the corpus runtime sweep (autoprop.py).
    "hypothesis==6.168.5",
    "mypy==2.4.1",
    # PostgreSQL's own scanner, libpg_query, which sqlc parses with (through
    # pg_query_go) and scanner.py holds the SQL rewriting to.
    "pglast==8.7",
    "psycopg[binary]==3.3.8",
    # The `nodejs` extra bundles node, so pyright never downloads it at runtime.
    "pyright[nodejs]==1.1.414",
    "pymysql==1.2.4",
    "pytest==9.2.0",
    # Reads sqlc configs, which may be YAML, when capturing the corpus.
    "pyyaml==6.0.3",
    # Must match the ruff crates in Cargo.toml, which the plugin formats with
    # (tests/rust/golden.rs holds the two together).
    "ruff==0.17.4",
    # SQLAlchemy 2.1 needs Python 3.11, so on 3.10 users get 2.0: generated code
    # must work with both, and the minimum Python tests the older one.
    "sqlalchemy[asyncio]==2.0.57; python_version < '3.11'",
    "sqlalchemy[asyncio]==2.1.8; python_version >= '3.11'",
    "types-pymysql==1.2.4.20261111",
    "types-pyyaml==6.0.12.20261111",
]

[tool.uv]
# The one uv pin: CI's setup-uv reads it (`version-file`), and uv enforces it
# locally too.
required-version = "==0.13.7"

[tool.ruff]
target-version = "py310"

# The lint contract for generated code: every rule, minus those generated code
# cannot or should not satisfy, each justified in docs/python-output.md, "Lint
# contract". `gate.py` applies exactly this to everything the plugin emits; the
# developer scripts extend it in `ruff.toml`.
[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "CPY", "D1",
    "D205", "D214", "D215", "D400", "D401", "D402", "D403", "D404", "D405", "D406",
    "D407", "D408", "D409", "D410", "D411", "D412", "D413", "D414", "D415", "D416",
    "D417",
    "D203", "D213", "D301", "RUF001", "RUF002",
    "E501", "E741", "A002", "PLR0913",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
# The runtime suite's tests import the shared `postgres` module from here.
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]
# A proof that runs nothing proves nothing: an empty parametrization fails, and
# so does a skipped test (conftest.py).
empty_parameter_set_mark = "fail_at_collect"
