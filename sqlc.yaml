# Example configuration, used to smoke-test the plugin end to end against the
# schema under tests/schemas/src/types.
version: "2"
plugins:
  - name: python
    wasm:
      url: file://./target/wasm32-wasip1/release/sqlc-gen-python.wasm
sql:
  - schema: tests/schemas/src/types/schema.sql
    queries: tests/schemas/src/types/query.sql
    engine: postgresql
    codegen:
      - out: example
        plugin: python
        options:
          package: example
          models:
            style: dataclass
