version: "2"
plugins:
  - name: python
    # This repository's plugin, as `cargo install --path .` builds it. Elsewhere,
    # use a release's `wasm` url and sha256 (see the README).
    process:
      cmd: sqlc-gen-python
sql:
  - engine: postgresql
    schema: schema.sql
    queries: query
    codegen:
      - out: invoicing_psycopg
        plugin: python
        options:
          backend: psycopg
          async: false
          raise_on_none: true
      - out: invoicing_psycopg_async
        plugin: python
        options:
          backend: psycopg
          async: true
          max_params: 3
      - out: invoicing_sqlalchemy
        plugin: python
        options:
          backend: sqlalchemy
          async: false
          raise_on_none: true
      - out: invoicing_sqlalchemy_async
        plugin: python
        options:
          backend: sqlalchemy
          async: true
