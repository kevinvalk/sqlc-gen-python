version: "2"
plugins:
  - name: python
    # This repository's plugin, as `cargo install --path .` builds it. Elsewhere,
    # use a release's `wasm` url and sha256 (see the README).
    process:
      cmd: sqlc-gen-python
sql:
  - engine: postgresql
    schema: schema.sql
    queries: query.sql
    codegen:
      - out: authors_exact_names
        plugin: python
        options:
          backend: sqlalchemy
          async: false
          models:
            exact_table_names: true
      - out: authors_sqlalchemy
        plugin: python
        options:
          backend: sqlalchemy
          async: false
