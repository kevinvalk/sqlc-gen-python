# Every layer of the proof (docs/python-output.md, "Proof"), and the
# plugin itself: `capture --check` builds it and runs it under the pinned sqlc,
# then a clean build on another runner must give the same bytes. `release.yml`
# calls this workflow for `main` and for a tag, so each is held to exactly
# these checks and releases exactly the plugin they ran. Each command fails
# loudly when what it needs is missing; the runners have Docker.
name: CI

on:
  # Renovate merges a branch of its own once these checks pass on it
  # (`automergeType: branch`), without a pull request.
  push:
    branches: ["renovate/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact, and a week old before Renovate proposes it: this uv runs in the job
  # whose build is released. tests/python/pyproject.toml holds the range a
  # developer's own uv must be in.
  UV_VERSION: "0.13.7"

# A Renovate branch that failed becomes a pull request, whose push already ran
# these checks. Only this repository's branch is Renovate's: a fork's of that
# name is checked like any other.
jobs:
  xtask:
    name: cargo xtask ${{ matrix.task }}
    if: >-
      ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # --check: docs/typemap.md must already say what verify finds, so
        # neither a hand edit nor a driver's change slips by.
        task: [check, verify --mutants --check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask ${{ matrix.task }}

  capture:
    name: cargo xtask capture --check
    if: >-
      ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      # sqlc's own singularisation is Go. Any Go bootstraps it: sqlc's go.mod
      # selects the toolchain (GOTOOLCHAIN=auto), so `stable` is not a pin.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask capture --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlc-gen-python.wasm
          path: target/wasm32-wasip1/release/sqlc-gen-python.wasm
          if-no-files-found: error

  # Uncached, so the plugin sqlc ran is proven to be what the source and the
  # pinned toolchain make. Same host triple: cargo mixes it into crate hashes,
  # so the bytes are reproducible per host, not across hosts.
  reproduce:
    name: clean rebuild gives the same plugin
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sqlc-gen-python.wasm
          path: tested
      - run: cargo wasm
      - run: |
          sha256sum tested/sqlc-gen-python.wasm target/wasm32-wasip1/release/sqlc-gen-python.wasm
          cmp tested/sqlc-gen-python.wasm target/wasm32-wasip1/release/sqlc-gen-python.wasm
